name: Remove all releases

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/remove-all-releases.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases and release tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          gh release list --repo "$repo" --limit 1000 --json tagName --jq '.[].tagName' > release-tags.txt
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "Deleting $tag"
            gh release delete "$tag" --repo "$repo" --cleanup-tag --yes
          done < release-tags.txt
          echo "Remaining releases:"
          gh release list --repo "$repo" --limit 20
